name: Deploy to GitHub Pages (Static)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install --prefer-offline --no-audit

      - name: ⚙️ Configure Next.js for GitHub Pages export
        run: |
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('next.config.mjs', 'utf8');
            if (!content.includes('output:')) {
              content = content.replace('reactStrictMode: true,', 'reactStrictMode: true,\n  output: \'export\',\n  images: { unoptimized: true },');
              fs.writeFileSync('next.config.mjs', content, 'utf8');
            }
          "

      - name: 🛠️ Build and export static site
        run: npm run build

      - name: 📤 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
